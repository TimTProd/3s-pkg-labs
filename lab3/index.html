<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обработка изображений</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Пороговая обработка и повышение резкости</h1>
<p>Вариант 8: глобальная и адаптивная пороговая обработка, высокочастотные фильтры</p>

<section class="panel">
  <label>Изображение из базы
    <select id="sample"></select>
  </label>
  <label>или свой файл
    <input id="file" type="file" accept="image/*">
  </label>
</section>

<section class="panel">
  <label>Метод
    <select id="op">
      <option value="otsu">Глобальный порог: метод Оцу</option>
      <option value="iterative">Глобальный порог: итеративный</option>
      <option value="sauvola">Адаптивный порог: Саувола</option>
      <option value="laplacian">Резкость: лапласиан</option>
      <option value="unsharp">Резкость: нерезкая маска</option>
      <option value="highpass">Высокочастотная составляющая</option>
    </select>
  </label>

  <label class="p-sauvola">Окно <input id="window" type="number" min="3" max="201" step="2" value="25"></label>
  <label class="p-sauvola">k <input id="k" type="number" min="0" max="1" step="0.01" value="0.34"></label>
  <label class="p-sauvola">R <input id="range" type="number" min="1" max="255" step="1" value="128"></label>

  <label class="p-laplacian">Соседей
    <select id="neighbors"><option value="4">4</option><option value="8">8</option></select>
  </label>
  <label class="p-laplacian">Сила <input id="strength" type="number" min="0" max="5" step="0.1" value="1"></label>

  <label class="p-unsharp p-highpass">Сигма <input id="sigma" type="number" min="0.3" max="20" step="0.1" value="1.5"></label>
  <label class="p-unsharp">Усиление <input id="amount" type="number" min="0" max="10" step="0.1" value="1.5"></label>

  <label class="p-filter">Края
    <select id="edge"><option value="clamp">Дублирование (Clamp)</option><option value="reflect">Отражение (Reflect)</option></select>
  </label>

  <button id="apply">Применить</button>
  <button id="compare">Сравнить пороговые методы</button>
  <span id="status"></span>
</section>

<section id="results"></section>

<script type="module" src="js/app.js"></script>
</body>
</html>
